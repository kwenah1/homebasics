name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'
  # The env context can't be referenced from job-level env, so the URLs are spelled out here.
  # Each job gets its own throwaway Postgres service, so sharing the URL is safe.
  DATABASE_URL: postgresql+psycopg://homebasics:homebasics@localhost:5432/homebasics
  TEST_DATABASE_URL: postgresql+psycopg://homebasics:homebasics@localhost:5432/homebasics

jobs:
  backend:
    name: Backend - lint, unit & integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: homebasics, POSTGRES_PASSWORD: homebasics, POSTGRES_DB: homebasics }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homebasics" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '${{ env.PYTHON_VERSION }}', cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Dependency audit (known CVEs)
        run: pip-audit -r requirements.txt
      - run: pytest --cov --cov-report=xml --cov-report=term --junitxml=results/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-results
          path: |
            backend/results/
            backend/coverage.xml

  frontend:
    name: Frontend - lint, typecheck, unit, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Dependency audit (known CVEs in shipped packages)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile is what production runs; a broken one should fail here, not at deploy.
      - run: docker build -t homebasics-api:ci backend
      - name: It boots and serves /health (degraded, with no database reachable)
        run: |
          {
            echo "DATABASE_URL=postgresql+psycopg://nobody:nobody@127.0.0.1:5432/nothing"
            echo "JWT_SECRET=ci-only-secret-not-used-in-production-000000"
          } > ci.env
          docker run -d --name api -p 8080:8080 --env-file ci.env homebasics-api:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/health || echo 000)
            if [ "$code" = "503" ] || [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          body=$(curl -s localhost:8080/api/v1/health)
          echo "$body"
          echo "$body" | grep -q '"database":"unavailable"'
          test "$(docker exec api id -u)" != "0"   # never root
          docker logs api | tail -5

  bug-hunt:
    name: Bug hunt - every injected bug must turn the tests red
    needs: [backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: homebasics, POSTGRES_PASSWORD: homebasics, POSTGRES_DB: homebasics }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homebasics" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '${{ env.PYTHON_VERSION }}', cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/bug_hunt.py

  e2e:
    name: E2E - Playwright (API, UI, a11y)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: homebasics, POSTGRES_PASSWORD: homebasics, POSTGRES_DB: homebasics }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homebasics" --health-interval 5s --health-retries 10
    env:
      ENVIRONMENT: test
      ENABLE_TEST_ENDPOINTS: 'true'
      JWT_SECRET: ci-only-secret-not-used-in-production-000000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Backend venv + migrate + seed
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/alembic upgrade head
          .venv/bin/python -m app.seed.run
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 14 }
