[project]
name = "homebasics-api"
version = "0.1.0"
description = "HomeBasics household goods store - FastAPI backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/seed/data.py" = ["E501", "S105"]  # tabular seed rows read better unwrapped
"alembic/env.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # third-party deprecations inside starlette's TestClient, not our code
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "unit: pure logic, no database",
    "integration: needs a PostgreSQL database",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/*"]
